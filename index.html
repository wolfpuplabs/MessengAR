<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MESSENG-AR Courier (WebXR)</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Komponen Penerbangan Acak Naga
    AFRAME.registerComponent('random-flight', {
      init: function () {
        this.state = 'idle';
        this.homePos = '0 0.2 0';
        this.startIdle();

        this.flightTimer = setInterval(() => {
          const dragon = document.getElementById('dragon-entity');
          const isVisible = dragon ? dragon.getAttribute('visible') : false;
          if ((isVisible === true || isVisible === 'true') && this.state === 'idle') {
            this.flyRandomly();
          }
        }, 8000);

        this.el.addEventListener('animationcomplete__fly', (e) => {
          if (this.state === 'flying') {
            setTimeout(() => this.returnHome(), 1000);
          } else if (this.state === 'returning') {
            this.startIdle();
          }
        });
      },
      
      startIdle: function() {
        this.state = 'idle';
        this.el.removeAttribute('animation__fly');
        this.el.setAttribute('animation__fly', { property: 'position', from: '0 0.2 0', to: '0 0.28 0', dir: 'alternate', dur: 1500, loop: true, easing: 'easeInOutSine' });
      },
      
      flyRandomly: function() {
        this.state = 'flying';
        this.el.removeAttribute('animation__fly');
        const x = (Math.random() - 0.5) * 1.6; 
        const y = 0.2 + (Math.random() * 0.6);
        const z = (Math.random() - 0.5) * 1.6; 

        this.el.setAttribute('animation__fly', { property: 'position', to: `${x} ${y} ${z}`, dur: 3000, loop: false, easing: 'easeInOutQuad' });
      },
      
      returnHome: function() {
        this.state = 'returning';
        this.el.removeAttribute('animation__fly');
        this.el.setAttribute('animation__fly', { property: 'position', to: this.homePos, dur: 2500, loop: false, easing: 'easeInOutQuad' });
      }
    });

    // Komponen Fire Dust Trail (Versi SUPER SLOW MO, GLOWING & DRAMATIC)
    AFRAME.registerComponent('fire-dust', {
      init: function () {
        const colors = ['#ff4400', '#ff9900', '#ffdd00', '#ffffff', '#ffeeaa'];
        const particleCount = 40; // Dikurangi sedikit agar lebih elegan dan tidak 'deras'

        for (let i = 0; i < particleCount; i++) {
          const p = document.createElement('a-sphere');
          
          const radius = Math.random() * 0.05;
          const angle = Math.random() * Math.PI * 2;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;
          const y = (Math.random() - 0.5) * 0.1;

          // Ukuran bervariasi: partikel core (mikro) & aura glow (agak besar)
          const isGlow = Math.random() > 0.6;
          const size = isGlow ? (0.002 + Math.random() * 0.002) : (0.0008 + Math.random() * 0.001);
          const color = colors[Math.floor(Math.random() * colors.length)];
          const maxOpacity = isGlow ? 0.4 : 0.9;
          
          // DURASI SUPER SLOW MO: 4 sampai 9 detik per siklus!
          const dur = 4000 + Math.random() * 5000; 
          
          // DELAY ACAK SANGAT PANJANG: Mencegah efek 'air terjun', partikel muncul satu-satu secara natural
          const delay = Math.random() * 6000;

          p.setAttribute('radius', size);
          p.setAttribute('position', `${x} ${y} ${z}`);
          
          // BLENDING ADDITIVE: Kunci efek 'Glowing' magis saat partikel saling tumpuk
          p.setAttribute('material', `shader: flat; color: ${color}; transparent: true; opacity: 0; blending: additive`);

          // FLOATING HALUS: Melayang menjauh ke samping & naik perlahan
          p.setAttribute(`animation__float`, {
            property: 'position',
            to: `${x + (Math.random()-0.5)*0.3} ${y + 0.15 + Math.random()*0.2} ${z + (Math.random()-0.5)*0.3}`,
            dur: dur,
            delay: delay,
            loop: true,
            dir: 'normal',
            easing: 'linear' // Linear agar mengambangnya konstan (tidak ngegas di awal)
          });

          // FADE IN & OUT (RAHASIA SLOW-MO): Muncul halus dari 0, terang di tengah, lalu hilang halus ke 0
          p.setAttribute(`animation__fade`, {
            property: 'material.opacity',
            from: 0,
            to: maxOpacity,
            dur: dur / 2, // Separuh waktu untuk terang, separuh untuk meredup
            delay: delay,
            loop: true,
            dir: 'alternate', // Efek memudar bolak-balik (
