<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messeng-AR - Global Voice Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .chat-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; min-height: 300px; max-height: 500px; overflow-y: auto; }
        .message { margin-bottom: 15px; text-align: left; background: #e3f2fd; padding: 10px; border-radius: 8px; }
        .message small { display: block; color: #555; font-size: 11px; margin-bottom: 5px; }
        button { padding: 15px 30px; font-size: 16px; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; color: white; font-weight: bold; }
        #recordBtn { background-color: #ff4757; }
        #recordBtn.recording { background-color: #2ed573; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <h2>🎙️ Messeng-AR Global</h2>
    
    <div class="chat-container" id="chatBox">
        <p style="color: gray; text-align: center;">Memuat pesan suara...</p>
    </div>

    <button id="recordBtn">Mulai Rekam Suara</button>
    <p id="statusText" style="font-size: 12px; color: gray;">Tekan tombol untuk merekam</p>

    <!-- Hanya Load Firebase Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref as dbRef, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // 1. GANTI DENGAN CONFIG FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCLqZ4O1n-Ggnj0yqgj9htHkoqgUyhzKDM",
authDomain: "messeng-ar.firebaseapp.com",
databaseURL: "https://messeng-ar-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "messeng-ar",
storageBucket: "messeng-ar.firebasestorage.app",
messagingSenderId: "797659694923",
appId: "1:797659694923:web:762c760cd1dd812c5d0ace"
        };

        // ==========================================
        // 2. GANTI DENGAN DATA CLOUDINARY ANDA
        // ==========================================
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/mspxd4by/video/upload"; 
        const CLOUDINARY_UPLOAD_PRESET = "preset_suara"; 

        // Inisialisasi Firebase Database
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const chatBox = document.getElementById('chatBox');

        // Memuat Pesan dengan Filter 24 Jam
        function loadMessages() {
            chatBox.innerHTML = ''; 
            const pesanRef = dbRef(database, 'pesan_global');
            const WAKTU_24_JAM = 24 * 60 * 60 * 1000;
            const waktuSekarang = Date.now();

            onChildAdded(pesanRef, (snapshot) => {
                const data = snapshot.val();
                
                if (waktuSekarang - data.timestamp <= WAKTU_24_JAM) {
                    const timeString = new Date(data.timestamp).toLocaleTimeString('id-ID');
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';
                    msgDiv.innerHTML = `
                        <small>Dikirim pukul: ${timeString}</small>
                        <audio controls src="${data.audioUrl}"></audio>
                    `;
                    chatBox.appendChild(msgDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        }

        // Setup Mikrofon
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                mediaRecorder.onstop = async () => {
                    statusText.innerText = "Mengunggah suara ke Cloudinary...";
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];

                    // Proses Upload ke Cloudinary
                    const formData = new FormData();
                    formData.append("file", audioBlob);
                    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

                    try {
                        const response = await fetch(CLOUDINARY_URL, {
                            method: "POST",
                            body: formData
                        });
                        const data = await response.json();
                        
                        if (data.secure_url) {
                            // Simpan link URL Cloudinary ke Firebase Database
                            await push(dbRef(database, 'pesan_global'), {
                                audioUrl: data.secure_url,
                                timestamp: Date.now()
                            });
                            statusText.innerText = "Pesan terkirim!";
                            setTimeout(() => statusText.innerText = "Tekan tombol untuk merekam", 2000);
                        } else {
                            throw new Error("Gagal mendapatkan URL dari Cloudinary");
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        statusText.innerText = "Gagal mengirim pesan.";
                    }
                };
            })
            .catch(err => {
                console.error("Mic error:", err);
                statusText.innerText = "Izinkan akses mikrofon di browser!";
            });

        // Tombol Rekam
        recordBtn.addEventListener('click', () => {
            if (!mediaRecorder) return alert("Mikrofon belum siap.");
            if (!isRecording) {
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "Hentikan & Kirim";
                recordBtn.classList.add('recording');
                statusText.innerText = "Sedang merekam...";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "Mulai Rekam Suara";
                recordBtn.classList.remove('recording');
            }
        });

        loadMessages();
    </script>
</body>
</html>
