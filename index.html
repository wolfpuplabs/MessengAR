<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Stick-AR Courier (WebXR)</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    /* ============ UI/UX REDESIGN: GLASSMORPHISM ============ */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { 
      margin: 0; font-family: system-ui, -apple-system, sans-serif; 
      background: #0b0c10; color: #f0f4f8; height: 100vh; overflow: hidden; 
    }
    
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 10; background: #0b0c10; }
    .glass-panel {
      background: rgba(22, 26, 32, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    header { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 16px 20px; background: rgba(11, 12, 16, 0.8);
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .logo { font-size: 24px; font-weight: 800; margin: 0; background: linear-gradient(90deg, #66fcf1, #45a29e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .primary-btn {
      background: linear-gradient(135deg, #45a29e, #1f2833);
      color: #fff; border: none; border-radius: 16px; padding: 14px 24px;
      font-weight: 700; font-size: 15px; cursor: pointer; transition: transform 0.2s;
      box-shadow: 0 4px 15px rgba(69, 162, 158, 0.3);
      pointer-events: auto;
    }
    .primary-btn:active { transform: scale(0.96); }
    .iconbtn { width: 44px; height: 44px; border-radius: 14px; border: none; background: #1f2833; color: #66fcf1; font-size: 18px; cursor: pointer; flex: none; pointer-events: auto; }
    
    #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .bub { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 14.5px; line-height: 1.5; word-wrap: break-word; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .bub small { display: block; opacity: 0.5; font-size: 11px; margin-top: 6px; }
    .bub audio { max-width: 100%; display: block; margin-top: 8px; height: 36px; }
    .out { align-self: flex-end; background: #1f2833; border-bottom-right-radius: 4px; border: 1px solid rgba(102, 252, 241, 0.2); }
    .in { align-self: flex-start; background: #202428; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    .event { align-self: center; background: rgba(69, 162, 158, 0.15); border: 1px dashed #45a29e; border-radius: 999px; padding: 8px 16px; font-size: 12px; cursor: pointer; color: #66fcf1; }
    
    .composer { display: flex; gap: 10px; padding: 16px; background: rgba(11, 12, 16, 0.9); border-top: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
    #txt { flex: 1; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 14px; background: #1f2833; color: #fff; font-size: 15px; outline: none; }
    #txt:focus { border-color: #45a29e; }
    
    .mic-on { background: #e33 !important; color: #fff !important; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.12); } }

    .overlay { justify-content: center; align-items: center; padding: 24px; background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(8px); }
    .overlay h2 { margin: 0 0 10px 0; font-size: 22px; color: #fff; }
    .overlay p { margin: 0 0 20px 0; color: #c5c6c7; font-size: 14.5px; line-height: 1.5; }
    #shareLink { background: #0b0c10; border: 1px solid #1f2833; border-radius: 12px; padding: 12px; font-size: 12px; color: #66fcf1; word-break: break-all; margin-bottom: 20px; }
    .row { display: flex; gap: 12px; justify-content: center; }
    
    /* AR DOM OVERLAY UI */
    #ar-ui-container { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 99; }
    .ar-top { display: flex; justify-content: space-between; pointer-events: auto; }
    #arHint { text-align: center; color: #fff; font-weight: 700; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; align-self: center; margin-top: 20px;}
    
    /* Popup Chat di AR (Menggantikan Plane 3D) */
    #arMessagePopup {
      pointer-events: auto;
      margin-top: 20px;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }
    #arMessageText { font-size: 16px; word-wrap: break-word; color: #fff; line-height: 1.5; }
    
    #arBtns { display: flex; justify-content: center; gap: 12px; pointer-events: auto; margin-bottom: 30px; }
    
    #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(11, 12, 16, 0.9); border: 1px solid #45a29e; border-radius: 999px; padding: 10px 20px; font-size: 14px; z-index: 100; color: #66fcf1; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

<!-- CHAT SCREEN -->
<div id="screen-chat" class="screen">
  <header>
    <span style="width:44px"></span>
    <h1 class="logo">Stick-AR</h1>
    <button id="btnName" class="iconbtn" title="Ganti Nama">✎</button>
  </header>
  <div id="msgs"></div>
  <div class="composer">
    <button id="btnMic" class="iconbtn" title="Rekam Suara">🎤</button>
    <input id="txt" placeholder="Ketik pesan..." autocomplete="off">
    <button id="btnSend" class="primary-btn">Kirim 🐉</button>
  </div>
</div>

<!-- SHARE MODAL -->
<div id="screen-share" class="screen overlay" hidden>
  <div class="glass-panel">
    <h2>Naga Siap Terbang! 🐉</h2>
    <p>Bagikan link ini ke penerima. Saat dibuka, naga laut akan muncul di AR mengantar pesanmu.</p>
    <div id="shareLink"></div>
    <div class="row">
      <button id="btnShare" class="primary-btn">Share</button>
      <button id="btnCopy" class="primary-btn">Copy</button>
      <button id="btnShareBack" class="iconbtn">✕</button>
    </div>
  </div>
</div>

<!-- INCOMING MODAL -->
<div id="screen-incoming" class="screen overlay" hidden>
  <div class="glass-panel">
    <h2>Courier Tiba!</h2>
    <p id="incFrom"></p>
    <button id="btnAccept" class="primary-btn">Buka di AR 👁️</button>
    <button id="btnIncLater" class="iconbtn" style="margin-top: 12px; width: 100%;">Tutup</button>
  </div>
</div>

<!-- NAME MODAL -->
<div id="nameModal" class="screen overlay" hidden>
  <div class="glass-panel">
    <h2>Selamat Datang</h2>
    <p>Masukkan nama kamu sebagai pengirim:</p>
    <input id="nameInput" maxlength="16" placeholder="Nama..." style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; margin-bottom: 20px; font-size: 16px; text-align: center;">
    <button id="btnNameSave" class="primary-btn" style="width: 100%;">Mulai ✨</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" hidden></div>

<!-- WEBXR AR SCENE -->
<div id="ar-ui-container" hidden>
  <div class="ar-top">
    <button id="btnBackAR" class="iconbtn">‹</button>
    <h1 class="logo">Stick-AR</h1>
    <span style="width:44px"></span>
  </div>
  
  <!-- Popup Teks AR Berbasis HTML (Bukan Plane 3D) -->
  <div id="arMessagePopup" class="glass-panel" hidden>
    <h3 style="margin-top:0; color:#66fcf1; font-size:14px; text-transform:uppercase;">Pesan Diterima</h3>
    <p id="arMessageText"></p>
    <audio id="arMessageAudio" controls hidden style="width: 100%; margin-top: 10px;"></audio>
  </div>

  <div id="arHint">Pindai lantai hingga cincin putih muncul.</div>
  
  <div id="arBtns">
    <button id="btnPlace" class="primary-btn" hidden>Panggil Naga</button>
    <button id="btnReply" class="primary-btn" hidden>Kembali ke Chat</button>
  </div>
</div>

<!-- Scene A-Frame disembunyikan saat tidak digunakan agar tidak freeze -->
<div id="scene-wrapper" hidden>
  <a-scene 
    webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #ar-ui-container"
    renderer="colorManagement: true"
    vr-mode-ui="enterVRButton: #btnAccept" 
    style="position: absolute; inset: 0; z-index: 1;">
    
    <a-assets>
      <!-- Ekstensi diubah menjadi .glb -->
      <a-asset-item id="dragon-model" src="dragon.glb"></a-asset-item>
    </a-assets>

    <a-camera id="camera" position="0 1.6 0"></a-camera>
    
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="0.6"></a-light>

    <a-entity id="xr-manager" webxr-hit-test></a-entity>

    <!-- Reticle -->
    <a-entity id="reticle" visible="false">
      <a-ring color="#66fcf1" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0"></a-ring>
    </a-entity>

    <!-- Naga Entity -->
    <a-entity 
      id="dragon-entity" 
      gltf-model="#dragon-model" 
      scale="0.5 0.5 0.5" 
      visible="false"
      animation-mixer="clip: *">
    </a-entity>
  </a-scene>
</div>

<script>
  /* ================= UTIL & STORAGE ================= */
  const $ = s => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));
  const baseLink = () => location.href.split('#')[0];
  function toast(t, ms = 2500) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(e._t); e._t = setTimeout(() => e.hidden = true, ms); }

  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  let myName = store.get('sar_name', '');
  let msgs = JSON.parse(store.get('sar_msgs', '[]'));
  let currentPayload = null;
  let pendingAudio = null;
  let lastShare = '';

  /* ================= UI LOGIC ================= */
  function saveName() {
    const v = ($('#nameInput').value || '').trim() || 'Anon';
    $('#nameModal').hidden = true;
    myName = v; store.set('sar_name', v);
    toast('Halo, ' + v + '!');
  }
  $('#btnNameSave').onclick = saveName;
  $('#btnName').onclick = () => { $('#nameInput').value = myName; $('#nameModal').hidden = false; };
  if (!myName) $('#nameModal').hidden = false;

  function renderMsgs() {
    const box = $('#msgs'); box.innerHTML = '';
    msgs.forEach((m, i) => {
      const d = document.createElement('div');
      if (m.kind === 'event') {
        d.className = 'event'; d.dataset.i = i;
        d.textContent = m.text + ' — Tap untuk lihat AR';
      } else {
        d.className = 'bub ' + (m.dir === 'out' ? 'out' : 'in');
        let html = '<b>' + (m.dir === 'out' ? myName : m.from) + '</b><br>' + m.text;
        if (m.payload && m.payload.audio) {
            html += '<audio controls src="' + m.payload.audio + '"></audio>';
        }
        html += '<small>' + new Date(m.t).toLocaleTimeString() + '</small>';
        d.innerHTML = html;
      }
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  }

  $('#msgs').addEventListener('click', e => {
    const el = e.target.closest('.event');
    if (!el) return;
    const m = msgs[el.dataset.i];
    if (m && m.payload) openAR(m.payload);
  });

  /* ================= AUDIO RECORDING ================= */
  let mRec = null;
  $('#btnMic').onclick = () => {
    if (mRec) { mRec.stop(); return; }
    if (!navigator.mediaDevices) { toast('Mic tidak didukung'); return; }
    
    navigator.mediaDevices.getUserMedia({ audio: true }).then(st => {
      mRec = new MediaRecorder(st, { audioBitsPerSecond: 20000 }); 
      const ch = [];
      mRec.ondataavailable = e => ch.push(e.data);
      mRec.onstop = () => {
        st.getTracks().forEach(t => t.stop());
        const r = new FileReader();
        r.onload = () => { pendingAudio = r.result; toast('🎤 Suara terlampir'); };
        r.readAsDataURL(new Blob(ch, { type: mRec.mimeType }));
        mRec = null; 
        $('#btnMic').classList.remove('mic-on');
      };
      mRec.start(); 
      $('#btnMic').classList.add('mic-on'); 
      toast('Merekam... tap 🎤 untuk stop');
      setTimeout(() => { if (mRec) mRec.stop() }, 10000); // Max 10 detik
    }).catch(() => toast('Mic tidak diizinkan'));
  };

  /* ================= SEND LOGIC ================= */
  $('#btnSend').onclick = () => {
    const text = $('#txt').value.trim();
    if (!text && !pendingAudio) return toast('Ketik pesan atau rekam suara dulu');
    
    const payload = { v: 1, id: uid(), from: myName, text: text || '(Voice Message)', audio: pendingAudio, t: Date.now() };
    msgs.push({ kind: 'event', dir: 'out', text: 'Naga dikirim', payload, t: Date.now() });
    store.set('sar_msgs', JSON.stringify(msgs));
    renderMsgs();
    
    lastShare = baseLink() + '#m=' + enc(payload);
    $('#shareLink').textContent = lastShare;
    $('#screen-share').hidden = false;
    $('#txt').value = '';
    pendingAudio = null;
    $('#btnMic').classList.remove('mic-on');
  };

  $('#btnShareBack').onclick = () => $('#screen-share').hidden = true;
  $('#btnCopy').onclick = () => { navigator.clipboard.writeText(lastShare).then(() => toast('Link tersalin!')); };
  $('#btnShare').onclick = async () => {
    try { await navigator.share({ title: 'Stick-AR', text: 'Ada naga pembawa pesan!', url: lastShare }); } 
    catch(e) { $('#btnCopy').click(); }
  };

  /* ================= INCOMING LOGIC ================= */
  function handlePayload(p) {
    currentPayload = p;
    $('#incFrom').textContent = 'Pesan rahasia dari ' + p.from;
    $('#screen-incoming').hidden = false;
  }
  
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/m=(.+)/);
    if (m) { try { handlePayload(dec(m[1])); } catch(e){} }
  });

  $('#btnIncLater').onclick = () => $('#screen-incoming').hidden = true;
  $('#btnAccept').onclick = () => {
    $('#screen-incoming').hidden = true;
    if (currentPayload && currentPayload.from !== myName && !msgs.some(m => m.payload && m.payload.id === currentPayload.id)) {
      msgs.push({ kind: 'event', dir: 'in', text: 'Naga tiba dari ' + currentPayload.from, payload: currentPayload, t: Date.now() });
      store.set('sar_msgs', JSON.stringify(msgs));
      renderMsgs();
    }
    openAR(currentPayload);
  };

  /* ================= TTS & AUDIO PLAYBACK ================= */
  function speakAndPlay(payload, onFinish) {
    if (payload.audio) {
      const audioEl = $('#arMessageAudio');
      audioEl.src = payload.audio;
      audioEl.hidden = false;
      audioEl.play().catch(() => {});
      audioEl.onended = onFinish;
    } else if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(payload.text);
      u.lang = 'id-ID';
      u.pitch = 1.2;
      u.rate = 1.0;
      u.onend = onFinish;
      u.onerror = onFinish;
      speechSynthesis.speak(u);
    } else {
      setTimeout(onFinish, 2000);
    }
  }

  /* ================= WEBXR HIT-TEST COMPONENT ================= */
  AFRAME.registerComponent('webxr-hit-test', {
    init: function () {
      this.xrHitTestSource = null;
      this.viewerSpace = null;
      this.refSpace = null;

      this.el.sceneEl.renderer.xr.addEventListener('sessionstart', (ev) => {
        let session = this.el.sceneEl.renderer.xr.getSession();
        session.requestReferenceSpace('viewer').then((space) => {
          this.viewerSpace = space;
          session.requestHitTestSource({ space: this.viewerSpace }).then((hitTestSource) => {
            this.xrHitTestSource = hitTestSource;
          });
        });
        session.requestReferenceSpace('local-floor').then((space) => { this.refSpace = space; });
      });

      this.el.sceneEl.renderer.xr.addEventListener('sessionend', () => {
        this.xrHitTestSource = null;
      });
    },
    tick: function () {
      if (this.el.sceneEl.is('ar-mode')) {
        if (!this.viewerSpace) return;
        let frame = this.el.sceneEl.frame;
        let xrViewerPose = frame.getViewerPose(this.refSpace);

        if (this.xrHitTestSource && xrViewerPose) {
          let hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(this.refSpace);
            const reticle = document.getElementById('reticle');
            reticle.setAttribute('position', pose.transform.position);
            reticle.setAttribute('visible', 'true');
            
            if ($('#dragon-entity').getAttribute('visible') === false) {
                $('#btnPlace').hidden = false;
                $('#arHint').textContent = "Lantai ditemukan! Tap Panggil Naga.";
            }
          } else {
             document.getElementById('reticle').setAttribute('visible', 'false');
             if ($('#dragon-entity').getAttribute('visible') === false) {
                $('#btnPlace').hidden = true;
                $('#arHint').textContent = "Mencari lantai/meja...";
             }
          }
        }
      }
    }
  });

  /* ================= AR LOGIC ================= */
  function openAR(payload) {
    currentPayload = payload;
    $('.screen').hidden = true;
    
    // Tampilkan wrapper A-Frame dan container UI-nya
    $('#scene-wrapper').hidden = false;
    $('#ar-ui-container').hidden = false;
    
    // Reset State
    $('#dragon-entity').setAttribute('visible', 'false');
    $('#arMessagePopup').hidden = true;
    $('#arMessageAudio').hidden = true;
    $('#arMessageAudio').pause();
    window.speechSynthesis.cancel(); // Stop TTS sebelumnya
    
    $('#btnPlace').hidden = true;
    $('#btnReply').hidden = true;
    $('#arHint').hidden = false;
    $('#arHint').textContent = "Memuat AR...";

    // Masuk ke VR/AR Mode
    document.querySelector('a-scene').enterVR();
  }

  $('#btnPlace').onclick = () => {
    const reticle = document.getElementById('reticle');
    const dragon = document.getElementById('dragon-entity');

    if (reticle.getAttribute('visible')) {
      // Pindahkan naga ke posisi reticle
      dragon.setAttribute('position', reticle.getAttribute('position'));
      dragon.setAttribute('visible', 'true');
      reticle.setAttribute('visible', 'false');
      
      $('#btnPlace').hidden = true;
      $('#arHint').hidden = true; // Sembunyikan hint

      if (currentPayload) {
        // Tampilkan teks menggunakan DOM Overlay (Bukan Plane 3D)
        $('#arMessageText').textContent = currentPayload.text;
        $('#arMessagePopup').hidden = false;
        
        // Putar audio / TTS
        speakAndPlay(currentPayload, () => {
           $('#btnReply').hidden = false;
        });
      }
    }
  };

  // FUNGSI UNTUK MENCEGAH FREEZE: Dengarkan event exit-vr bawaan A-Frame
  document.querySelector('a-scene').addEventListener('exit-vr', function () {
    window.speechSynthesis.cancel(); // Hentikan suara jika user tiba-tiba keluar
    $('#arMessageAudio').pause();
    
    // Sembunyikan scene A-Frame sepenuhnya agar tidak berat/freeze di background
    $('#scene-wrapper').hidden = true;
    $('#ar-ui-container').hidden = true;
    $('#screen-chat').hidden = false;
  });

  const closeAR = () => {
    // Ini akan memicu event 'exit-vr' di atas
    document.querySelector('a-scene').exitVR(); 
  };

  $('#btnBackAR').onclick = closeAR;
  $('#btnReply').onclick = closeAR;

  /* ================= BOOT ================= */
  renderMsgs();
  const initMatch = location.hash.match(/m=(.+)/);
  if (initMatch) { try { handlePayload(dec(initMatch[1])); } catch(e){} }
</script>
</body>
</html>
