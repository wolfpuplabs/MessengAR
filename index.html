<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messeng-AR - Global Voice Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .chat-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; min-height: 300px; max-height: 500px; overflow-y: auto; }
        .message { margin-bottom: 15px; text-align: left; background: #e3f2fd; padding: 10px; border-radius: 8px; }
        .message small { display: block; color: #555; font-size: 11px; margin-bottom: 5px; }
        button { padding: 15px 30px; font-size: 16px; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; color: white; font-weight: bold; }
        #recordBtn { background-color: #ff4757; }
        #recordBtn.recording { background-color: #2ed573; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <h2>🎙️ Messeng-AR Global</h2>
    
    <div class="chat-container" id="chatBox">
        <p style="color: gray; text-align: center;">Memuat pesan suara...</p>
    </div>

    <button id="recordBtn">Mulai Rekam Suara</button>
    <p id="statusText" style="font-size: 12px; color: gray;">Tekan tombol untuk merekam</p>

    <!-- Menggunakan Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref as dbRef, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // ==========================================
        // GANTI BAGIAN INI DENGAN CONFIG FIREBASE ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "PROJECT_ID_ANDA.firebaseapp.com",
            databaseURL: "https://PROJECT_ID_ANDA-default-rtdb.firebaseio.com",
            projectId: "PROJECT_ID_ANDA",
            storageBucket: "PROJECT_ID_ANDA.appspot.com",
            messagingSenderId: "SENDER_ID_ANDA",
            appId: "APP_ID_ANDA"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const storage = getStorage(app);

        // Variabel untuk perekam suara
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const chatBox = document.getElementById('chatBox');

        // Fungsi Memuat Pesan (Filter 24 Jam Terakhir)
        function loadMessages() {
            chatBox.innerHTML = ''; 
            const pesanRef = dbRef(database, 'pesan_global');
            const WAKTU_24_JAM = 24 * 60 * 60 * 1000;
            const waktuSekarang = Date.now();

            onChildAdded(pesanRef, (snapshot) => {
                const data = snapshot.val();
                
                // HANYA TAMPILKAN JIKA USIA PESAN KURANG DARI 24 JAM
                if (waktuSekarang - data.timestamp <= WAKTU_24_JAM) {
                    const timeString = new Date(data.timestamp).toLocaleTimeString('id-ID');
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';
                    msgDiv.innerHTML = `
                        <small>Dikirim pukul: ${timeString}</small>
                        <audio controls src="${data.audioUrl}"></audio>
                    `;
                    chatBox.appendChild(msgDiv);
                    chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll ke bawah
                }
            });
        }

        // Setup Media Recorder (Merekam Suara User)
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    statusText.innerText = "Mengunggah suara...";
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = []; // Reset

                    // 1. Upload ke Storage
                    const fileName = `voice_chats/audio_${Date.now()}.webm`;
                    const fileRef = storageRef(storage, fileName);
                    
                    try {
                        await uploadBytes(fileRef, audioBlob);
                        const downloadUrl = await getDownloadURL(fileRef);

                        // 2. Simpan URL ke Realtime Database
                        await push(dbRef(database, 'pesan_global'), {
                            audioUrl: downloadUrl,
                            timestamp: Date.now()
                        });
                        
                        statusText.innerText = "Pesan terkirim!";
                        setTimeout(() => statusText.innerText = "Tekan tombol untuk merekam", 2000);
                    } catch (error) {
                        console.error("Error:", error);
                        statusText.innerText = "Gagal mengirim pesan.";
                    }
                };
            })
            .catch(err => {
                console.error("Mic access denied:", err);
                statusText.innerText = "Izinkan akses mikrofon di browser!";
            });

        // Event Listener Tombol Rekam
        recordBtn.addEventListener('click', () => {
            if (!mediaRecorder) return alert("Mikrofon belum siap atau tidak diizinkan.");

            if (!isRecording) {
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "Hentikan & Kirim";
                recordBtn.classList.add('recording');
                statusText.innerText = "Sedang merekam...";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "Mulai Rekam Suara";
                recordBtn.classList.remove('recording');
            }
        });

        // Panggil fungsi saat web dibuka
        loadMessages();
    </script>
</body>
</html>
